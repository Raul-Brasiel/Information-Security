<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Segurança da Informação</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div class="flex justify-center text-3xl">
        <h1 class="">Implementação Web de Algoritmos Criptográficos</h1>
    </div>

    <div class="grid justify-center mt-10 mx-[50vh] bg-gray-700 rounded-xl py-10">
        <h2 class="text-2xl text-white text-center mb-10">Criptografia simétrica de bloco DES</h2>

        <input type="text" id="keyInput" maxlength="8" class="p-2 rounded-md" placeholder="Enter a key (8 chars)">

        <label for="fileInput" class="text-white mt-10">Selecionar arquivo (.jpg, .png, .pdf, etc.):</label>
        <input type="file" id="fileInput" class="text-white">

        <div class="mt-10">
            <button id="btnEncrypt" class="bg-green-500 p-2 rounded-md text-white hover:bg-green-600 transition">Cifrar arquivo e Baixar</button>
            <button id="btnDecrypt" class="bg-red-500 p-2 rounded-md text-white hover:bg-red-600 transition ml-2">Decifrar arquivo e Baixar</button>
        </div>
    </div>

    <div class="grid mt-10 mx-[50vh] bg-gray-700 rounded-xl py-10 px-10 mb-20">
        <h2 class="text-2xl text-white text-center mb-10">Criptografia assimétrica RSA</h2>

        <div class="mb-5 flex flex-col items-center w-full">
            <button id="btnGenerateRSAKeys" class="bg-blue-500 p-2 rounded-md text-white hover:bg-blue-600 transition w-full mb-4">Gerar Chaves Aleatórias</button>
            
            <div class="flex gap-4 w-full">
                <div class="w-1/2">
                    <label class="text-white text-sm">Chave Pública:</label>
                    <input type="text" id="rsaPubKey" class="w-full p-2 rounded-md text-sm" placeholder="Aguardando geração..." readonly>
                </div>
                <div class="w-1/2">
                    <label class="text-white text-sm">Chave Privada:</label>
                    <input type="text" id="rsaPrivKey" class="w-full p-2 rounded-md text-sm" placeholder="Aguardando geração..." readonly>
                </div>
            </div>
        </div>

        <label class="text-white">Mensagem (Texto ou Números Cifrados):</label>
        <textarea id="rsaMessageInput" rows="3" class="p-2 rounded-md w-full" placeholder="Digite o texto para cifrar ou os números para decifrar..."></textarea>

        <div class="mt-5 flex justify-center gap-4">
            <button id="btnEncryptRSA" class="bg-green-500 p-2 rounded-md text-white hover:bg-green-600 transition">Cifrar Mensagem</button>
            <button id="btnDecryptRSA" class="bg-red-500 p-2 rounded-md text-white hover:bg-red-600 transition">Decifrar Mensagem</button>
        </div>
        
        <label class="text-white mt-5">Resultado:</label>
        <textarea id="rsaOutput" rows="3" class="p-2 rounded-md w-full bg-gray-300" readonly></textarea>
    </div>

    <footer class="bottom-0 w-full bg-gray-800 text-white p-1 text-center">Implementado por Raul Brasiel</footer>
    
    <script src="js/des/des-tables.js"></script>
    <script src="js/des/des-utils.js"></script>
    <script src="js/des/des-core.js"></script>
    <script src="js/des/des-cbc.js"></script>
    <script src="js/des/des-ui.js"></script>

    <script src="js/rsa/rsa-math.js"></script>
    <script src="js/rsa/rsa-core.js"></script>
    <script src="js/rsa/rsa-ui.js"></script>
</body>
</html>
